[project]
name = "o2-audit"
version = "0.1.0"
description = "O2 AI product-review agent core (Stage 02b: 62-rule build artifacts, lifecycle, o2-audit CLI)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "jsonschema>=4",
    "pillow>=10",
    "httpx>=0.27",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "pypdfium2>=4",
]

[project.scripts]
o2-audit = "o2_audit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/o2_audit", "src/o2_public_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
